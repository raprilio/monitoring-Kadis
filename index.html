<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kepala Desa</title>
<meta name="description" content="Ringkasan laporan seluruh aplikasi desa: aplikasi warga, kiosk, inventaris aset, data warga, server, dan blangko.">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 96px; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }

  /* ---------- kerangka: sidebar + isi ---------- */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; background: var(--side-bg); color: var(--side-ink); display: flex; flex-direction: column; gap: 20px; padding: 18px 14px; overflow: auto; }
  .side-brand { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .logo svg { stroke-width: 2.2; }
  .side-brand b { display: block; color: #fff; font-size: 16px; line-height: 1.2; }
  .side-brand span { font-size: 12px; color: var(--side-muted); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--side-ink); text-decoration: none; font-size: 14px; }
  .nav a:hover { background: var(--side-hover); }
  .nav a[aria-current="true"] { color: #fff; font-weight: 600; background: linear-gradient(90deg, rgba(255, 138, 31, .24), rgba(255, 138, 31, .05)); box-shadow: inset 3px 0 0 var(--accent); }
  .nav .ic { width: 20px; height: 20px; flex: none; }
  .nav .st { margin-left: auto; line-height: 0; }
  .nav .st .ico { width: 16px; height: 16px; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .side-tv { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px; color: var(--accent-ink); background: linear-gradient(135deg, #ffb347, var(--accent)); }
  .side-tv.simple { background: var(--side-hover); color: #fff; border: 1px solid rgba(255,255,255,.18); }
  .side-src { font-size: 12px; color: var(--side-muted); line-height: 1.4; padding: 0 4px; }
  .content { min-width: 0; display: flex; flex-direction: column; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 12px 28px; background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .top h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .top p { font-size: 13px; color: var(--ink2); }
  .top-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .top-r .lbl { font-size: 13px; color: var(--ink2); }
  .badge-demo { display: inline-block; margin-left: 8px; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 400; color: var(--ink2); vertical-align: 2px; }
  .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .btn:hover { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
  .btn[aria-pressed="true"] { border-color: var(--s1); }
  .seg-ctl { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg-ctl button { background: none; border: 0; padding: 6px 14px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .seg-ctl button + button { border-left: 1px solid var(--border); }
  .seg-ctl button:hover { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
  .seg-ctl button[aria-checked="true"] { font-weight: 600; background: color-mix(in srgb, var(--s1) 14%, var(--surface)); }
  .seg-ctl .chk { width: 14px; height: 14px; visibility: hidden; }
  .seg-ctl button[aria-checked="true"] .chk { visibility: visible; }
  .updated { font-size: 12.5px; color: var(--ink2); }
  main { padding: 24px 28px 24px; transition: opacity .15s; }
  footer { padding: 0 28px 40px; font-size: 12.5px; color: var(--ink2); }
  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 10px; overflow-x: auto; }
    .side-brand span, .side-foot .side-src { display: none; }
    .side-brand b { white-space: nowrap; font-size: 14px; }
    .nav { flex-direction: row; }
    .nav a { white-space: nowrap; padding: 8px 12px; }
    .nav a .st { display: none; }
    .side-foot { margin: 0; }
    .side-tv span { display: none; }
    .top, main, footer { padding-left: 16px; padding-right: 16px; }
    html { scroll-padding-top: 130px; }
  }

  /* ---------- data kependudukan ---------- */
  .sourcebar { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .sourcebar .src-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; font-size: 14px; }
  .row-btns, .pager-btns { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .err { color: var(--crit-text); font-size: 13.5px; font-weight: 600; }
  .import-report { border-top: 1px solid var(--grid); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .t-sub { font-size: 12.5px; color: var(--ink2); }
  .filters { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
  .fgroup { display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; align-items: center; }
  .f-title { font-size: 13px; color: var(--ink2); }
  .f-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13.5px; }
  .chip:hover { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
  .chip[aria-pressed="true"] { border-color: var(--s1); background: color-mix(in srgb, var(--s1) 14%, var(--surface)); font-weight: 600; }
  .chip .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .filters input, .filters select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; }
  .filters input[type="number"] { width: 78px; }
  .filters input[type="search"] { width: min(100%, 320px); }
  .range { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .warga-count { font-size: 14px; color: var(--ink2); margin: 4px 0 12px; }
  .warga-results > .card { margin-bottom: 12px; }
  .sortbtn, .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .sortbtn { font-weight: 500; color: var(--ink2); white-space: nowrap; }
  .linkbtn { color: var(--s1); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  td.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 10px; font-size: 13px; color: var(--ink2); flex-wrap: wrap; }
  dialog.detail { width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  dialog.detail::backdrop { background: rgba(0, 0, 0, .55); }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .detail-head h3 { font-size: 20px; font-weight: 600; }
  .detail-head p { color: var(--ink2); font-size: 14px; }
  .detail-warn { margin: 10px 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12.5px; color: var(--ink2); }
  .detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  .detail-body h4 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--ink2); }
  .detail-body .span2 { grid-column: 1 / -1; }
  .kv2 { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; margin: 0; font-size: 13.5px; }
  .kv2 dt { color: var(--ink2); }
  .kv2 dd { margin: 0; overflow-wrap: anywhere; }
  .nikrow { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nikrow .btn { padding: 2px 10px; font-size: 12px; }
  .fam { margin: 0; padding-left: 18px; font-size: 13.5px; columns: 2; }
  .fam .me { font-weight: 600; }
  @media (max-width: 700px) {
    .fgroup { grid-template-columns: 1fr; }
    .detail-body { grid-template-columns: 1fr; }
    .fam { columns: 1; }
  }
  .stack-seg.dim { opacity: .3; }
  .kv-keys dt { display: flex; align-items: center; gap: 8px; }
  .kv-keys .box { width: 12px; height: 12px; border-radius: 3px; }
  .kv-keys .off { color: var(--muted); font-weight: 400; }
  .meters.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px 32px; }

  /* ---------- ringkasan ---------- */
  main.is-loading { opacity: .55; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    min-width: 0;
  }
  .alert-list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  .alert-list li { border-top: 1px solid var(--grid); }
  .alert-list a {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: start;
    padding: 8px 4px; text-decoration: none; color: inherit; border-radius: 6px;
  }
  .alert-list a:hover { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
  .alert-list .ico { margin-top: 3px; }
  .alert-list .a-title { font-size: 14px; }
  .alert-list .a-detail { font-size: 12.5px; color: var(--ink2); }
  .alert-list .a-sec { font-size: 12px; color: var(--ink2); white-space: nowrap; }
  .sev { font-size: 12px; font-weight: 600; margin-right: 6px; }
  .all-good { display: flex; gap: 10px; align-items: center; padding: 12px 0; font-size: 14px; }


  /* ---------- ringkasan: KPI + peta + peringatan ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi-grid .hero { grid-column: span 2; display: grid; grid-template-columns: minmax(200px, 0.8fr) minmax(0, 1.2fr); align-items: center; gap: 4px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%); }
  .hero-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hero-trend { min-width: 0; }
  @media (max-width: 700px) { .kpi-grid .hero { grid-template-columns: 1fr; } }
  .hero .hero-label { font-size: 14px; color: var(--ink2); }
  .hero .hero-val { font-size: clamp(44px, 5vw, 64px); line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  .hero .hero-sub { font-size: 14px; color: var(--ink2); }
  .hero .hero-sub b { color: var(--ink); font-weight: 600; }
  @media (max-width: 1500px) { .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi-grid .hero { grid-column: span 3; } }
  @media (max-width: 1000px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi-grid .hero { grid-column: span 2; } }
  @media (max-width: 560px) { .kpi-grid { grid-template-columns: 1fr; } .kpi-grid .hero { grid-column: span 1; } }
  .overview2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .overview2 { grid-template-columns: 1fr; } }
  .mapcard { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
  .mapframe { aspect-ratio: 160 / 105; border-radius: 12px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); }
  .mapcard .note { font-size: 12px; color: var(--muted); }
  .alerts { display: flex; flex-direction: column; min-height: 0; }
  .alerts h2 { font-size: 16px; font-weight: 600; }
  .alerts .alerts-sub { font-size: 13px; color: var(--ink2); margin: 2px 0 10px; }
  .alerts .alert-list { flex: 1; max-height: 520px; }

  /* ---------- seksi ---------- */
  .sec { margin-top: 36px; }
  .sec-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
  .sec-num {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    font-size: 14px; font-weight: 600; background: color-mix(in srgb, var(--s1) 14%, var(--surface)); border: 1px solid var(--border);
  }
  .sec-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .insight { font-size: 14px; color: var(--ink2); margin-top: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr)); gap: 12px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; }
  .tile .t-label { font-size: 13px; color: var(--ink2); }
  .tile .t-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .tile .t-val { font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
  .tile .t-sub { font-size: 12.5px; color: var(--ink2); }
  .tile .t-delta { font-size: 12.5px; color: var(--ink2); }
  .tile .t-delta .d { font-weight: 600; }
  .tile .t-delta .d.good { color: var(--good-text); }
  .tile .t-delta .d.bad { color: var(--crit-text); }
  .tile .spark { flex: none; }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .card-head h3 { font-size: 14.5px; font-weight: 600; }
  .card-head p { font-size: 12.5px; color: var(--ink2); }
  .card-head .btn { padding: 3px 10px; font-size: 12px; flex: none; }

  /* ---------- grafik ---------- */
  .plot svg { display: block; max-width: 100%; touch-action: pan-y; }
  .plot .grid { stroke: var(--grid); stroke-width: 1; }
  .plot .axis { stroke: var(--axis); stroke-width: 1; }
  .plot .tick { fill: var(--muted); font-size: 11px; }
  .plot .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .plot .cross { stroke: var(--axis); stroke-width: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; flex: none; }
  .legend i.line { width: 14px; height: 2px; border-radius: 2px; }
  .legend i.box { width: 10px; height: 10px; border-radius: 2px; }

  .hbars { display: flex; flex-direction: column; gap: 10px; }
  .hbar-row { display: grid; grid-template-columns: minmax(100px, 38%) minmax(0, 1fr); gap: 4px 10px; align-items: center; border-radius: 6px; }
  .hbar-label { font-size: 13px; color: var(--ink2); }
  .hbar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hbar-fill { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .1s; }
  .hbar-row:hover .hbar-fill, .hbar-row:focus-visible .hbar-fill { filter: brightness(1.12); }
  .hbar-val { font-size: 13px; font-weight: 600; white-space: nowrap; }
  @media (max-width: 520px) {
    .hbar-row { grid-template-columns: 1fr; }
  }

  .stack-rows { display: flex; flex-direction: column; gap: 12px; }
  .stack-row { border-radius: 6px; }
  .stack-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; font-size: 13px; }
  .stack-top .l { color: var(--ink); }
  .stack-top .r { color: var(--ink2); font-size: 12.5px; text-align: right; }
  .stack-bar { display: flex; gap: 2px; height: 16px; }
  .stack-seg { min-width: 3px; border-radius: 2px; transition: filter .1s; }
  .stack-seg:hover { filter: brightness(1.12); }

  .meters { display: flex; flex-direction: column; gap: 14px; }
  .meter-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .meter-top .l { color: var(--ink2); }
  .meter-top .v { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .meter-track { height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--fillc) 20%, var(--surface)); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 5px; background: var(--fillc); }

  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 14px; }
  .kv dt { color: var(--ink2); }
  .kv dd { margin: 0; font-weight: 600; text-align: right; }

  /* ---------- tabel ---------- */
  .tablewrap { overflow: auto; max-height: 300px; }
  .tablewrap.tall { max-height: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink2); font-weight: 500; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.nowrap { white-space: nowrap; }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; max-width: 280px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12.5px;
  }
  #tip[hidden] { display: none; }
  #tip .tip-title { color: var(--ink2); margin-bottom: 4px; }
  #tip .tip-row { display: flex; align-items: center; gap: 8px; }
  #tip .tip-key { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  #tip .tip-val { font-weight: 600; font-size: 13.5px; }
  #tip .tip-name { color: var(--ink2); }


  /* tekstur cadangan untuk cetak / forced-colors (identitas tidak bergantung warna saja) */
  @media print, (forced-colors: active) {
    .stack-seg:nth-child(odd), .hbar-fill { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.35) 0 2px, transparent 2px 6px); }
    .stack-seg:nth-child(even) { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.35) 0 2px, transparent 2px 6px); }
  }
  @media print {
    .side, .top .top-r { display: none; }
    .shell { display: block; }
    .sec { break-inside: avoid-page; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-brand"><span class="logo" id="side-logo"></span><div><b>Monitoring Desa</b><span id="side-desa"></span></div></div>
    <nav class="nav" id="nav" aria-label="Bagian laporan"></nav>
    <div class="side-foot">
      <a class="side-tv simple" href="ringkas.html" id="side-simple"></a>
      <a class="side-tv" href="tv.html" id="side-tv"></a>
      <p class="side-src" id="side-src"></p>
    </div>
  </aside>
  <div class="content">
    <header class="top">
      <div>
        <h1>Dashboard Kepala Desa <span class="badge-demo" id="demo-badge" hidden>Data contoh</span></h1>
        <p id="desa-name"></p>
      </div>
      <div class="top-r">
        <span class="lbl" id="periode-lbl">Periode</span>
        <div class="seg-ctl" role="radiogroup" aria-labelledby="periode-lbl" id="periode"></div>
        <button class="btn" id="theme-btn" type="button" aria-pressed="false">Mode gelap</button>
        <span class="updated" id="updated"></span>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer id="footer"></footer>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="warga.js"></script>
<script src="shared.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
