<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kondisi Desa Hari Ini</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  body { font: 20px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; }
  body.idle { cursor: none; }

  /* Mode layar lebar/TV: panggung 1920x1080 diskalakan, tanpa scroll. Mode lain (HP, tablet tegak): mengalir ke bawah. */
  body.stage { overflow: hidden; height: 100vh; }
  body.stage #app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 28px 40px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 18px; }
  body.flow #app { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; margin: 0 auto; }

  /* ---------- atas ---------- */
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .head h1 { font-size: 50px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
  .head .sub { font-size: 24px; color: var(--ink2); margin-top: 4px; }
  .demo { display: inline-block; margin-left: 10px; padding: 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 30%, var(--surface)); color: var(--ink); font-size: 18px; font-weight: 600; vertical-align: 4px; }
  .clock { text-align: right; white-space: nowrap; }
  .clock .t { font-size: 56px; line-height: 1; font-weight: 800; }
  .clock .d { font-size: 22px; color: var(--ink2); }

  .banner { display: flex; align-items: center; gap: 22px; padding: 14px 30px; border-radius: 24px; background: color-mix(in srgb, var(--bc) 14%, var(--surface)); border: 2px solid color-mix(in srgb, var(--bc) 55%, var(--surface)); }
  .banner .big-ico { flex: none; line-height: 0; }
  .banner .big-ico svg { width: 64px; height: 64px; }
  .banner h2 { font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
  .banner p { font-size: 22px; color: var(--ink2); margin-top: 4px; }

  /* ---------- kartu ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 18px; min-height: 0; }
  body.flow .cards { grid-template-columns: 1fr; grid-template-rows: none; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 18px 26px 18px 30px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 0; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--bc); }
  .c-top { display: flex; align-items: center; gap: 14px; }
  .c-ico { flex: none; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--s1) 14%, var(--surface)); color: var(--s1); }
  .c-ico svg { width: 30px; height: 30px; }
  .c-top h3 { font-size: 28px; font-weight: 800; flex: 1; line-height: 1.15; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px 4px 10px; border-radius: 999px; font-size: 22px; font-weight: 700; background: color-mix(in srgb, var(--bc) 18%, var(--surface)); white-space: nowrap; }
  .chip svg { width: 26px; height: 26px; }
  .c-num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
  .c-num b { font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  .c-num span { font-size: 26px; color: var(--ink2); }
  .c-barrow { display: flex; align-items: center; gap: 14px; }
  .c-barrow span { font-size: 20px; color: var(--ink2); white-space: nowrap; min-width: 150px; text-align: right; }
  .c-bar { flex: 1; height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--s1) 18%, var(--surface)); overflow: hidden; }
  .c-bar i { display: block; height: 100%; border-radius: 8px; background: var(--s1); }
  .c-txt { font-size: 23px; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- daftar tindak lanjut ---------- */
  .todo { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 14px 26px 14px; box-shadow: var(--shadow); }
  .todo h2 { font-size: 30px; font-weight: 800; display: flex; align-items: baseline; gap: 14px; }
  .todo h2 small { font-size: 20px; font-weight: 400; color: var(--ink2); }
  .todo ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 36px; }
  body.flow .todo ol { grid-template-columns: 1fr; }
  .todo li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
  .todo li svg { width: 32px; height: 32px; margin-top: 2px; }
  .todo .tx { font-size: 24px; font-weight: 700; line-height: 1.25; }
  .todo .sa { font-size: 20px; color: var(--ink2); margin-top: 1px; }
  .todo .ok { display: flex; align-items: center; gap: 14px; font-size: 28px; margin-top: 10px; }
  .todo .ok svg { width: 40px; height: 40px; }
  .foot { font-size: 18px; color: var(--ink2); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .foot a { text-decoration: none; border-bottom: 1px solid var(--axis); }
  body.stage .foot { display: none; }

  /* HP / tablet tegak */
  body.flow .head { flex-wrap: wrap; align-items: flex-start; }
  body.flow .head h1 { font-size: 34px; }
  body.flow .head .sub { font-size: 18px; }
  body.flow .clock .t { font-size: 36px; }
  body.flow .clock .d { font-size: 16px; }
  body.flow .banner { padding: 14px 16px; gap: 14px; }
  body.flow .banner h2 { font-size: 26px; }
  body.flow .banner p { font-size: 17px; }
  body.flow .banner .big-ico svg { width: 44px; height: 44px; }
  body.flow .card { padding: 16px 16px 16px 22px; }
  body.flow .c-top { flex-wrap: wrap; }
  body.flow .c-top h3 { font-size: 22px; }
  body.flow .chip { font-size: 17px; }
  body.flow .c-num b { font-size: 52px; }
  body.flow .c-num span { font-size: 20px; }
  body.flow .c-txt { font-size: 18px; -webkit-line-clamp: unset; display: block; }
  body.flow .c-barrow span { font-size: 16px; min-width: 110px; }
  body.flow .todo h2 { font-size: 22px; flex-wrap: wrap; }
  body.flow .todo .tx { font-size: 19px; }
  body.flow .todo .sa { font-size: 16px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="stage">
<div id="app"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="warga.js"></script>
<script src="shared.js"></script>
<script src="ui.js"></script>
<script src="ringkas.js"></script>
</body>
</html>
