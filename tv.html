<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kepala Desa (Tampilan TV)</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); }
  body { font: 18px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  body.idle { cursor: none; }
  h1, h2, p { margin: 0; }
  button { font: inherit; color: inherit; }

  /* Panggung tetap 1920x1080, diskalakan agar pas di layar mana pun (pinggiran kosong bila bukan 16:9). */
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
    padding: 20px; display: grid; grid-template-columns: 84px 1fr; gap: 16px;
  }
  .col { display: grid; grid-template-rows: 92px 112px minmax(0, 1fr) 262px; gap: 14px; min-height: 0; min-width: 0; }

  /* ---------- rel samping ---------- */
  .rail { background: var(--side-bg); border-radius: 20px; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .rail .logo { margin-bottom: 6px; }
  .rail .r { position: relative; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: var(--side-ink); }
  .rail .r .ic { width: 28px; height: 28px; }
  .rail .r .n { position: absolute; left: 6px; top: 4px; font-size: 14px; color: var(--side-muted); font-weight: 600; }
  .rail .r .ico { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; }
  .rail .r.act { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--accent); }

  /* ---------- header ---------- */
  .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; min-width: 0; }
  .brand h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .brand p { font-size: 19px; color: var(--ink2); white-space: nowrap; }
  .demo { display: inline-block; margin-left: 8px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 17px; color: var(--ink2); }
  .flt { font-size: 19px; font-weight: 600; margin-left: 10px; padding: 1px 16px; border-radius: 999px; border: 2px solid var(--fc, var(--muted)); background: transparent; cursor: pointer; vertical-align: 3px; }
  .flt:focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
  .hero { text-align: center; }
  .hero .h-label { font-size: 18px; color: var(--ink2); }
  .hero .h-row { display: flex; align-items: baseline; justify-content: center; gap: 16px; }
  .hero .h-val { font-size: 60px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  .hero .h-delta { font-size: 21px; font-weight: 600; }
  .clock { text-align: right; }
  .clock .c-time { font-size: 52px; line-height: 1.05; font-weight: 700; }
  .clock .c-date { font-size: 19px; color: var(--ink2); }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; min-height: 0; }
  .kpis .kpi-card { padding: 12px 16px; gap: 6px; }
  .kpis .kpi-card .k-top { font-size: 16px; white-space: nowrap; }
  .kpis .kpi-card .k-top svg { width: 22px; height: 22px; }
  .kpis .kpi-card .k-val { font-size: 38px; }
  .kpis .kpi-card .k-sub { font-size: 16px; }
  .kpis .kpi-card .k-st .ico { width: 20px; height: 20px; }

  /* ---------- panel ---------- */
  .main { display: grid; grid-template-columns: 470px minmax(0, 1fr) 470px; gap: 14px; min-height: 0; }
  .bottom { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; min-height: 0; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; overflow: hidden; }
  .ph { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .ph .num { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 17px; background: color-mix(in srgb, var(--s1) 18%, var(--surface)); }
  .ph h2 { font-size: 20px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .pill { font-size: 16px; }
  .ph .pill .ico { width: 18px; height: 18px; }
  .ph .pg { font-size: 16px; color: var(--ink2); }
  .sub { font-size: 16px; color: var(--ink2); }
  .sub b { color: var(--ink); font-weight: 600; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }

  .rowline { display: grid; align-items: center; gap: 10px; font-size: 17px; }
  .rowline .n { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowline .v { font-weight: 600; white-space: nowrap; text-align: right; display: inline-flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .rowline .ico { width: 18px; height: 18px; }
  .bar { display: flex; gap: 2px; height: 14px; min-width: 0; }
  .bar .seg { min-width: 3px; border-radius: 2px; }
  .hfill { height: 14px; border-radius: 0 4px 4px 0; min-width: 3px; }
  .meter { height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--fillc) 22%, var(--surface)); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 6px; background: var(--fillc); }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 16px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .chart { flex: 1; min-height: 0; }
  .chart svg { display: block; }
  .tick { fill: var(--muted); font-size: 15px; }
  .grid-l { stroke: var(--grid); stroke-width: 1; }
  .axis-l { stroke: var(--axis); stroke-width: 1; }
  .endlabel { fill: var(--ink); font-size: 18px; font-weight: 700; }

  /* kependudukan */
  .siak-top { display: flex; align-items: center; gap: 16px; }
  .siak-leg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .siak-leg .rowline { grid-template-columns: 14px 1fr auto auto; }
  .siak-leg .rowline i { width: 12px; height: 12px; border-radius: 3px; }
  .siak-leg .pc { color: var(--ink2); font-weight: 500; min-width: 40px; }
  .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--grid); padding-top: 8px; }
  .ringbox { display: flex; align-items: center; gap: 12px; }
  .ringbox .t { font-size: 17px; color: var(--ink2); line-height: 1.25; }
  .ringbox .t b { display: block; font-size: 19px; color: var(--ink); }

  /* peta */
  .panel.map { padding: 0; position: relative; background: var(--surface2); }
  .map-svg { position: absolute; inset: 0; }
  .map-title { position: absolute; left: 16px; top: 14px; display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border); font-weight: 700; font-size: 20px; }
  .map-title .sub { font-weight: 400; }
  .map-leg { position: absolute; left: 16px; bottom: 14px; max-width: 470px; padding: 8px 14px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border); }
  .map-leg .map-legend { font-size: 16px; gap: 4px 18px; }
  .map-leg .map-legend svg { width: 18px; height: 18px; }
  .map-info { position: absolute; right: 16px; bottom: 14px; width: 300px; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .map-info .t { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .map-info .tp { font-size: 16px; color: var(--ink2); }
  .map-info .d { font-size: 17px; }

  /* peringatan */
  .alert-list { display: flex; flex-direction: column; gap: 0; transition: opacity .35s; }
  .alert-list.fade { opacity: 0; }
  .a-item { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--grid); align-items: start; }
  .a-item:first-child { border-top: 0; }
  .a-item .ico { width: 22px; height: 22px; margin-top: 2px; }
  .a-item .a-title { font-size: 19px; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .a-item .a-detail { font-size: 16px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-ok { display: flex; align-items: center; gap: 14px; padding: 16px 0; font-size: 22px; }
  .t-ok .ico { width: 30px; height: 30px; }
</style>
</head>
<body class="tv">
<div id="stage">
  <nav class="rail" id="rail" aria-label="Bagian laporan"></nav>
  <div class="col">
    <header class="head">
      <div class="brand">
        <h1>Dashboard Kepala Desa <button type="button" class="flt" id="flt" title="Filter data warga (panel Data Kependudukan). Klik atau tombol panah kiri/kanan untuk ganti status perkawinan"></button></h1>
        <p><span id="desa"></span> <span class="demo" id="demo" hidden>Data contoh</span></p>
      </div>
      <div class="hero" id="hero"></div>
      <div class="clock"><div class="c-time" id="time"></div><div class="c-date" id="date"></div></div>
    </header>
    <section class="kpis" id="kpis" aria-label="Ringkasan"></section>
    <section class="main" id="main"></section>
    <section class="bottom" id="bottom"></section>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="warga.js"></script>
<script src="shared.js"></script>
<script src="ui.js"></script>
<script src="tv.js"></script>
</body>
</html>
