<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kepala Desa (Tampilan TV)</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d68;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
    --s1: #2a78d6; --s2: #eb6834; --neutral-seg: #c3c2b7;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --good-text: #006300; --crit-text: #d03b3b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --s1: #3987e5; --s2: #d95926; --neutral-seg: #55544f;
    --good-text: #0ca30c; --crit-text: #e66767;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); }
  body { font: 20px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  body.idle { cursor: none; }
  h1, h2, p { margin: 0; }

  /* Panggung tetap 1920x1080, diskalakan agar pas di layar mana pun (letterbox bila bukan 16:9). */
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
    padding: 28px; display: grid; grid-template-rows: 104px 1fr 84px; gap: 16px;
  }

  /* ---------- header ---------- */
  .head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; }
  .brand h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .brand p { font-size: 20px; color: var(--ink2); }
  .brand .demo { display: inline-block; margin-left: 12px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 18px; color: var(--ink2); vertical-align: 4px; }
  .hero { text-align: center; }
  .hero .h-label { font-size: 20px; color: var(--ink2); }
  .hero .h-row { display: flex; align-items: baseline; justify-content: center; gap: 18px; }
  .hero .h-val { font-size: 64px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .hero .h-delta { font-size: 22px; font-weight: 600; }
  .clock { text-align: right; }
  .clock .c-time { font-size: 56px; line-height: 1.05; font-weight: 600; }
  .clock .c-date { font-size: 20px; color: var(--ink2); }

  .good { color: var(--good-text); }
  .bad { color: var(--crit-text); }

  /* ---------- panel ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; min-height: 0; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 22px 16px;
    display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden;
  }
  .panel > header { display: flex; align-items: center; gap: 12px; }
  .panel .num { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: 20px; background: color-mix(in srgb, var(--s1) 16%, var(--surface)); }
  .panel h2 { font-size: 27px; font-weight: 600; letter-spacing: -0.01em; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 20px; }
  .pill b { font-weight: 600; }
  .pill .ico { width: 20px; height: 20px; }

  .kpis { display: flex; gap: 14px; }
  .kpi { flex: 1; min-width: 0; }
  .k-label { font-size: 19px; color: var(--ink2); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .k-label i { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .k-val { font-size: 52px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
  .k-val small { font-size: 26px; font-weight: 600; letter-spacing: 0; }
  .k-sub { font-size: 18px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-sub .d { font-weight: 600; }
  .kpi .k-sub { font-size: 17px; }

  .viz { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; padding-top: 4px; border-top: 1px solid var(--grid); }
  .chart { flex: 1; min-height: 0; }
  .chart svg { display: block; }
  .tick { fill: var(--muted); font-size: 17px; }
  .grid-l { stroke: var(--grid); stroke-width: 1; }
  .axis-l { stroke: var(--axis); stroke-width: 1; }
  .endlabel { fill: var(--ink); font-size: 21px; font-weight: 600; }

  .rowline { display: grid; align-items: center; gap: 12px; font-size: 20px; }
  .rowline .n { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowline .v { font-weight: 600; white-space: nowrap; text-align: right; }
  .bar { display: flex; gap: 2px; height: 16px; min-width: 0; }
  .bar .seg { min-width: 3px; border-radius: 2px; }
  .hfill { height: 16px; border-radius: 0 4px 4px 0; min-width: 3px; }
  .meter { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--fillc) 22%, var(--surface)); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 7px; background: var(--fillc); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 18px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; }
  .foot { font-size: 19px; color: var(--ink2); margin-top: auto; }
  .foot b { color: var(--ink); font-weight: 600; }

  /* ---------- ticker "perlu perhatian" ---------- */
  .ticker { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: stretch; }
  .t-count { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; }
  .t-count .t-title { font-size: 24px; font-weight: 600; }
  .t-count .t-sub { display: flex; gap: 16px; font-size: 20px; color: var(--ink2); }
  .t-count .t-sub span { display: inline-flex; align-items: center; gap: 6px; }
  .t-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; transition: opacity .35s; }
  .t-list.fade { opacity: 0; }
  .t-item { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 18px; display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: center; min-width: 0; }
  .t-item .ico { width: 22px; height: 22px; }
  .t-item .a-title { font-size: 21px; font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .t-item .a-detail { font-size: 18px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-ok { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; gap: 14px; padding: 0 24px; font-size: 24px; }
  .t-ok .ico { width: 28px; height: 28px; }
</style>
</head>
<body>
<div id="stage">
  <div class="head">
    <div class="brand">
      <h1>Dashboard Kepala Desa <span class="demo" id="demo" hidden>Data contoh</span></h1>
      <p id="desa"></p>
    </div>
    <div class="hero" id="hero"></div>
    <div class="clock"><div class="c-time" id="time"></div><div class="c-date" id="date"></div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="ticker" id="ticker"></div>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="tv.js"></script>
</body>
</html>
