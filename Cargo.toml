[package]
name = "wisata-gateway"
version = "0.1.0"
edition = "2021"
description = "Digital guestbook & turnstile access controller for a tourist park (Rust server + web UI)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["compression-gzip"] }
rand = "0.9"
rust-embed = { version = "8", features = ["mime-guess"] }

[profile.release]
lto = "thin"
strip = true
